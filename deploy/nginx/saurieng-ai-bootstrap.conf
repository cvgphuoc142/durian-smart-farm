# HTTP only, used until the Let's Encrypt certificate exists. deploy.sh switches to
# saurieng-ai.conf once /etc/letsencrypt/live/saurieng-ai/fullchain.pem is present.

server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;
  return 444;
}

server {
  listen 80;
  listen [::]:80;
  server_name saurieng-ai.giaphuoccv.com api-saurieng-ai.giaphuoccv.com media-saurieng-ai.giaphuoccv.com;

  location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
  location / { return 503 "Dang cai dat\n"; }
}
