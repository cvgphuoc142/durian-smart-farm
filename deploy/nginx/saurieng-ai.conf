# Admin web, API and media (MinIO) for Sau Rieng AI. Linked into nginx by deploy/deploy.sh.
# Written for nginx 1.18 (Ubuntu 20.04): http2 goes on the listen line.

# The API has no CORS middleware: nginx answers for the admin origin only.
map $http_origin $saurieng_cors {
  default "";
  "https://saurieng-ai.giaphuoccv.com" $http_origin;
}

# Unknown hosts get nothing.
server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;
  return 444;
}

server {
  listen 80;
  listen [::]:80;
  server_name saurieng-ai.giaphuoccv.com api-saurieng-ai.giaphuoccv.com media-saurieng-ai.giaphuoccv.com;
  location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
  location / { return 301 https://$host$request_uri; }
}

# Admin web (static build) + /privacy/ and /support/ pages.
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name saurieng-ai.giaphuoccv.com;
  ssl_certificate     /etc/letsencrypt/live/saurieng-ai/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/saurieng-ai/privkey.pem;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options nosniff always;

  root /opt/saurieng-ai/public/current;
  location /assets/ { try_files $uri =404; expires 30d; add_header Cache-Control "public, immutable"; }
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/index.html /index.html;
  }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name api-saurieng-ai.giaphuoccv.com;
  ssl_certificate     /etc/letsencrypt/live/saurieng-ai/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/saurieng-ai/privkey.pem;
  client_max_body_size 20m;

  location / {
    add_header Access-Control-Allow-Origin $saurieng_cors always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Request-Id" always;
    add_header Access-Control-Expose-Headers "X-Request-Id" always;
    add_header Access-Control-Max-Age 600 always;
    add_header Vary Origin always;
    if ($request_method = OPTIONS) { return 204; }

    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }
}

# Presigned URLs are signed for this host: keep Host, path and query untouched.
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name media-saurieng-ai.giaphuoccv.com;
  ssl_certificate     /etc/letsencrypt/live/saurieng-ai/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/saurieng-ai/privkey.pem;
  client_max_body_size 300m;

  location / {
    proxy_pass http://127.0.0.1:9000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 300s;
  }
}
