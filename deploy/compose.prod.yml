# Production stack for the VPS. Run it through deploy/lib.sh (`dc ...`), which passes the
# project name and the secrets file used for ${...} interpolation.
# Only nginx on the host is public: api and minio publish on 127.0.0.1, mongo and qdrant not at all.

x-logging: &logging
  driver: json-file
  options: {max-size: 10m, max-file: "3"}

services:
  # Single-node replica set: the API needs transactions.
  mongo:
    image: mongo:7
    # Small VPS (2 GB RAM): cap the WiredTiger cache instead of the default half of RAM.
    command: ["--replSet", "rs0", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.25"]
    volumes: ["mongo_data:/data/db"]
    restart: unless-stopped
    logging: *logging
    healthcheck:
      # Initiates the replica set on first start, then reports healthy once a primary exists.
      test:
        - CMD-SHELL
        - >
          mongosh --quiet --eval "try { rs.status().ok } catch (e) {
          rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }"
          && mongosh --quiet --eval "if (!db.hello().isWritablePrimary) quit(1)"
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s

  qdrant:
    image: qdrant/qdrant:v1.14.1
    volumes: ["qdrant_data:/qdrant/storage"]
    restart: unless-stopped
    logging: *logging

  # Upstream MinIO no longer publishes images; Chainguard builds it from source. Pulled once
  # (pull_policy: missing) so an update of the app never silently upgrades storage.
  minio:
    image: cgr.dev/chainguard/minio:latest
    pull_policy: missing
    command: server /data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?S3_ACCESS_KEY missing in production.env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?S3_SECRET_KEY missing in production.env}
      # The admin web uploads model files straight to presigned URLs.
      MINIO_API_CORS_ALLOW_ORIGIN: https://saurieng-ai.giaphuoccv.com
    ports: ["127.0.0.1:9000:9000"]
    volumes: ["minio_data:/data"]
    restart: unless-stopped
    logging: *logging

  api:
    image: saurieng-api:${RELEASE:-latest}
    build: ../durianBackend
    env_file: [/opt/saurieng-ai/production.env]
    ports: ["127.0.0.1:8000:8000"]
    restart: unless-stopped
    logging: *logging
    depends_on:
      mongo: {condition: service_healthy}
      qdrant: {condition: service_started}
      minio: {condition: service_started}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  mongo_data: {name: saurieng_ai_mongo_data}
  qdrant_data: {name: saurieng_ai_qdrant_data}
  minio_data: {name: saurieng_ai_minio_data}
