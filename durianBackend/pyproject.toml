[project]
name = "durian-backend"
version = "0.1.0"
description = "DurianOS API (FastAPI + MongoDB)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pymongo>=4.13",
    "pyjwt[crypto]>=2.15.1",
    "google-genai>=2.32.0",
    "qdrant-client>=1.20.0",
    "boto3>=1.43.118",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
    "testcontainers[mongodb]>=4.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: needs a real MongoDB replica set (docker)"]

[tool.uv]
# The production VPS exposes a baseline x86-64 CPU (no SSE4/AVX). NumPy 2.4+ needs
# x86-64-v2, so keep it below that until the server CPU changes.
constraint-dependencies = ["numpy<2.4"]
