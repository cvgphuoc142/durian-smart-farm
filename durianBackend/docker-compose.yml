services:
  # Atlas local = replica set (transactions) + $vectorSearch, single node.
  mongo:
    image: mongodb/mongodb-atlas-local:7
    ports: ["27017:27017"]
    volumes: ["mongo-data:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      retries: 20

  minio:
    profiles: ["storage"]  # not used until Phase 5 (media); upstream stopped publishing public images
    image: quay.io/minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: durian
      MINIO_ROOT_PASSWORD: durian-dev-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio-data:/data"]

  api:
    build: .
    env_file: [.env]
    environment:
      MONGO_URI: mongodb://mongo:27017/?directConnection=true
    ports: ["8000:8000"]
    depends_on:
      mongo: {condition: service_healthy}

volumes:
  mongo-data:
  minio-data:
