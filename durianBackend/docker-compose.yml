services:
  # Plain MongoDB as a single-node replica set (transactions). RAG vectors are NOT here: see qdrant.
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports: ["27017:27017"]
    volumes: ["mongo-data:/data/db"]
    healthcheck:
      # Initiates the replica set on first run, then reports healthy once a primary exists.
      test:
        - CMD-SHELL
        - >
          mongosh --quiet --eval "try { rs.status().ok } catch (e) {
          rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok }"
          && mongosh --quiet --eval "if (!db.hello().isWritablePrimary) quit(1)"
      interval: 5s
      retries: 20

  # Dedicated vector DB for RAG chunks.
  qdrant:
    image: qdrant/qdrant:v1.14.1
    ports: ["6333:6333"]
    volumes: ["qdrant-data:/qdrant/storage"]

  minio:
    profiles: ["storage"]  # not used until Phase 5 (media)
    # Upstream minio/minio and quay.io/minio/minio no longer publish images; Chainguard builds
    # MinIO from source (same S3 API, same env vars). Free tier only carries :latest.
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: durian
      MINIO_ROOT_PASSWORD: durian-dev-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio-data:/data"]

  api:
    build: .
    env_file: [.env]
    environment:
      MONGO_URI: mongodb://mongo:27017/?directConnection=true
      QDRANT_URL: http://qdrant:6333
      S3_ENDPOINT_URL: http://minio:9000
    ports: ["8000:8000"]
    depends_on:
      mongo: {condition: service_healthy}
      qdrant: {condition: service_started}

volumes:
  mongo-data:
  qdrant-data:
  minio-data:
